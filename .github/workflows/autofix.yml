name: CI

on:
  pull_request:
  push:
    branches: ['main']
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: portfolio-old-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verify and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
      CONTENTFUL_PREVIEW_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 8.15.5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm run verify
      - name: Build with Contentful
        if: env.CONTENTFUL_SPACE_ID != '' && env.CONTENTFUL_DELIVERY_TOKEN != '' && env.CONTENTFUL_PREVIEW_TOKEN != ''
        run: pnpm run build
      - name: Report deferred Contentful build
        if: env.CONTENTFUL_SPACE_ID == '' || env.CONTENTFUL_DELIVERY_TOKEN == '' || env.CONTENTFUL_PREVIEW_TOKEN == ''
        run: echo "Astro build deferred because the repository has no Contentful Actions secrets configured."
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
